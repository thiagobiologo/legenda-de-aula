<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guia Legenda de Aula</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;800&display=swap">
<style>
/* Layout: coluna única estreita, passo a passo com barra de progresso e uma "legenda" amarela como assinatura visual. */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --ink: #14202e; --mute: #56657a; --line: #d6dde7;
  --accent: #1d4ed8; --accent-ink: #ffffff; --cap-bg: #101923; --cap-fg: #ffe066; --ok: #1a7f4b; --warn: #a15c00;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d141c; --surface: #16202b; --ink: #eaf0f7; --mute: #9aabbf; --line: #2a3848;
  --accent: #7aa7ff; --accent-ink: #0d141c; --cap-bg: #05090e; --cap-fg: #ffe066; --ok: #5bd694; --warn: #f0b429; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d141c; --surface: #16202b; --ink: #eaf0f7; --mute: #9aabbf; --line: #2a3848;
  --accent: #7aa7ff; --accent-ink: #0d141c; --cap-bg: #05090e; --cap-fg: #ffe066; --ok: #5bd694; --warn: #f0b429; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 17px/1.55 var(--f-body); padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 18px; }
.proto { background: var(--cap-bg); color: var(--cap-fg); font-size: 13px; padding: 8px 12px; border-radius: 6px; letter-spacing: .02em; }
header { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
h1 { font: 800 clamp(26px, 6vw, 36px)/1.1 var(--f-display); margin: 0; text-wrap: balance; }
.sub { color: var(--mute); margin: 6px 0 0; max-width: 46ch; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.lang button { border: 0; background: var(--surface); color: var(--ink); font: inherit; padding: 8px 14px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.prog { display: flex; gap: 6px; }
.prog i { flex: 1; height: 8px; border-radius: 4px; background: var(--line); }
.prog i.done { background: var(--ok); } .prog i.now { background: var(--accent); }
.meta { display: flex; justify-content: space-between; color: var(--mute); font-size: 14px; margin-top: -8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px 20px; display: grid; gap: 16px; }
h2 { font: 800 clamp(22px, 5vw, 28px)/1.15 var(--f-display); margin: 0; text-wrap: balance; }
.stage { aspect-ratio: 16/9; max-width: 100%; border-radius: 10px; position: relative; overflow: hidden; container-type: inline-size;
  background: linear-gradient(135deg, #2b4a7a, #16294a); cursor: pointer; user-select: none; font-size: 2cqw; color: #14202e; }
.vcap { color: var(--mute); font-size: 14px; margin-top: -8px; }
.stage .wf { position: absolute; background: #f7f8fa; border-radius: 1cqw; box-shadow: 0 1cqw 3cqw #0005; }
.stage .tb { background: #e2e7ee; padding: .8cqw 1.4cqw; font-size: 1.9cqw; border-radius: 1cqw 1cqw 0 0; font-weight: 700; }
.stage .ic { position: absolute; display: grid; justify-items: center; gap: .4cqw; font-size: 5cqw; line-height: 1; }
.stage .ic span { font-size: 1.8cqw; background: #fff; padding: .2cqw .8cqw; border-radius: .4cqw; }
.stage .menu { position: absolute; background: #fff; border: 1px solid #c7d0dc; box-shadow: 0 .6cqw 2cqw #0004; padding: .4cqw; font-size: 1.9cqw; z-index: 3; }
.stage .menu div { padding: .5cqw 2.4cqw .5cqw 1cqw; }
.stage .dlg { position: absolute; background: #fff; border-radius: 1cqw; box-shadow: 0 1cqw 3cqw #0007; padding: 1.6cqw; font-size: 1.9cqw; z-index: 3; }
.stage .btn2 { position: absolute; background: #1d4ed8; color: #fff; padding: .6cqw 2cqw; border-radius: .5cqw; font-size: 1.9cqw; }
.stage .btn2.g { background: #e2e7ee; color: #14202e; }
.stage .term { position: absolute; background: #0b0f14; color: #d6e2f0; font: 1.9cqw/1.6 ui-monospace, Consolas, monospace; padding: 1.6cqw; border-radius: 1cqw; z-index: 3; }
.stage .term .ok { color: #5bd694; font-weight: 700; }
.stage .url { position: absolute; background: #fff; border: 1px solid #c7d0dc; border-radius: 2cqw; padding: .6cqw 1.6cqw; font-size: 1.9cqw; }
.stage .tgl { position: absolute; width: 5cqw; height: 2.6cqw; border-radius: 1.3cqw; background: #9aa7b8; transition: background .3s; }
.stage .tgl::after { content: ""; position: absolute; left: .3cqw; top: .3cqw; width: 2cqw; height: 2cqw; border-radius: 50%; background: #fff; transition: left .3s; }
.stage .tgl.on { background: #1d4ed8; } .stage .tgl.on::after { left: 2.7cqw; }
.stage .sel { position: absolute; background: #fff; border: 1px solid #a9b6c8; border-radius: .6cqw; padding: .8cqw 1.4cqw; font-size: 1.9cqw; }
.stage .sel.on { border: .3cqw solid #1d4ed8; background: #eaf0ff; font-weight: 700; }
.stage .lbl { position: absolute; font-size: 1.9cqw; font-weight: 700; }
.stage .pan { position: absolute; background: #14161a; color: #eceff4; border-radius: .8cqw; z-index: 3; font-size: 1.6cqw; overflow: hidden; }
.stage .pan .ln { position: absolute; left: 5%; right: 5%; line-height: 1.3; }
.stage .pan .ln.hi { border-left: .4cqw solid #ffd166; background: #2b2410; padding-left: 1cqw; }
.stage .cur { position: absolute; width: 3cqw; height: 3cqw; z-index: 5; pointer-events: none; transition: left .9s ease, top .9s ease; filter: drop-shadow(0 1px 1px #0008); }
.stage .rip { position: absolute; width: 5cqw; height: 5cqw; border: .4cqw solid #ffe066; border-radius: 50%; z-index: 4; opacity: 0; pointer-events: none; transform: translate(-50%, -50%); }
.stage .rip.go { animation: rip .55s ease-out; }
@keyframes rip { 0% { transform: translate(-50%, -50%) scale(.3); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; } }
.stage .capb { position: absolute; left: 3%; right: 3%; bottom: 3%; text-align: center; background: #000c; color: #ffe066; font-size: 2.5cqw; padding: .8cqw 1.4cqw; border-radius: .8cqw; z-index: 6; }
.stage .rp { position: absolute; inset: 0; display: grid; place-items: center; background: #000a; color: #ffe066; font-weight: 700; font-size: 3cqw; z-index: 7; }
@media (prefers-reduced-motion: reduce) { .stage .cur, .stage .tgl, .stage .tgl::after { transition: none; } .stage .rip.go { animation: none; } }
ol.do { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; counter-reset: s; }
ol.do li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; min-width: 0; }
ol.do li::before { content: counter(s); width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font: 800 16px/34px var(--f-display); text-align: center; }
code, .k { font: 600 .92em ui-monospace, Consolas, monospace; background: var(--bg); border: 1px solid var(--line); padding: 1px 6px; border-radius: 5px; overflow-wrap: anywhere; }
.see { border: 1px dashed var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 8px; }
.see small { color: var(--mute); text-transform: uppercase; letter-spacing: .08em; font-size: 12px; }
.win { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; font-size: 14px; display: grid; gap: 8px; }
.win .bar { color: var(--mute); font-size: 12px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.btn-fake { background: var(--accent); color: var(--accent-ink); padding: 5px 14px; border-radius: 5px; font-weight: 700; }
.btn-fake.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.sw { width: 40px; height: 22px; border-radius: 11px; background: var(--accent); position: relative; flex: none; }
.sw::after { content: ""; position: absolute; right: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--accent-ink); }
.note { border-left: 4px solid var(--warn); background: var(--bg); padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: 15px; }
.cap-demo { background: var(--cap-bg); color: var(--cap-fg); border-radius: 8px; padding: 12px 14px; font-size: 16px; }
.cap-demo b { color: #9fc2ff; font-size: 13px; display: block; }
.dir { display: flex; gap: 8px; flex-wrap: wrap; }
.dir span { border: 1px solid var(--line); padding: 8px 12px; border-radius: 8px; }
.dir span.on { border-color: var(--accent); background: var(--bg); font-weight: 700; }
label.chk { display: flex; gap: 10px; align-items: center; cursor: pointer; font-weight: 700; }
label.chk input { width: 22px; height: 22px; accent-color: var(--accent); }
nav { display: flex; justify-content: space-between; gap: 10px; }
nav button { font: 700 17px var(--f-body); border-radius: 10px; padding: 13px 22px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-width: 120px; }
nav button.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
nav button:disabled { opacity: .4; cursor: default; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.resume { background: var(--surface); border: 2px solid var(--accent); border-radius: 12px; padding: 16px 18px; display: grid; gap: 12px; }
.resume p { margin: 0; font-weight: 700; }
.resume .acts { display: flex; gap: 10px; flex-wrap: wrap; }
.resume button { font: 700 16px var(--f-body); border-radius: 8px; padding: 10px 18px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.resume button.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.lkb input { width: 100%; font: 600 15px ui-monospace, Consolas, monospace; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.lkb .acts { display: flex; gap: 10px; flex-wrap: wrap; }
.lkb button, .lkb a.wa { font: 700 16px var(--f-body); border-radius: 8px; padding: 11px 18px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; }
.lkb button.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.dlbtn { display: block; text-align: center; background: var(--accent); color: var(--accent-ink); font: 800 19px var(--f-display); padding: 16px 18px; border-radius: 10px; text-decoration: none; }
.dlbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.done-box { text-align: center; display: grid; gap: 10px; justify-items: center; }
.done-box .big { font: 800 56px/1 var(--f-display); color: var(--ok); }
</style>

<div class="wrap">
  <div class="proto" id="proto"></div>
  <header>
    <div>
      <h1 id="t"></h1>
      <p class="sub" id="st"></p>
    </div>
    <div class="lang" role="group" aria-label="Idioma / Idioma">
      <button id="bpt" aria-pressed="true">Português</button>
      <button id="bes" aria-pressed="false">Español</button>
    </div>
  </header>
  <div class="prog" id="prog" aria-hidden="true"></div>
  <div class="meta"><span id="stepOf"></span><span id="time"></span></div>
  <div id="resume"></div>
  <section class="card" id="card" aria-live="polite"></section>
  <nav>
    <button id="back"></button>
    <button id="next" class="main"></button>
  </nav>
</div>

<script>
const T = {
  pt: {
    proto: "Projeto gratuito e sem fins lucrativos. Funciona só no Windows, com o Google Chrome.",
    title: "Legenda de Aula", sub: "Legenda e tradução ao vivo das aulas do mestrado, grátis, no seu computador com Windows.",
    of: (a, b) => `Passo ${a} de ${b}`, time: "cerca de 15 minutos, com a reinicialização", back: "Voltar", next: "Próximo passo", finish: "Concluir", restart: "Ver de novo",
    video: "Animação deste passo. Clique na imagem para ver de novo.", checked: "Já fiz este passo",
    steps: [
      { h: "Baixe e abra a pasta", cap: "Baixando e extraindo a pasta",
        do: ["Clique no botão azul <b>Baixar o instalador (.zip)</b> logo abaixo e espere terminar.", "Abra o <b>Explorador de Arquivos</b> (o ícone de pasta amarela na barra de baixo da tela) e clique em <b>Downloads</b>, no menu da esquerda.", "Clique com o <b>botão direito</b> do mouse em <code>Legenda-de-Aula.zip</code> (no notebook, toque com dois dedos no touchpad) e escolha <b>Extrair tudo…</b>.", "Clique em <b>Extrair</b> e abra a pasta que apareceu. <b>Não abra os arquivos de dentro do zip</b>: extraia primeiro."],
        note: "Se o Chrome avisar que este tipo de arquivo não é baixado com frequência, clique em <b>Manter</b>. É o instalador gratuito deste guia.",
        see: "Você vai ver uma pasta com estes itens", mock: "files", dl: true },
      { h: "Instale o cabo de áudio", cap: "Instalando o cabo de áudio",
        do: ["Dentro da pasta, dê dois cliques em <code>INSTALAR.bat</code>.", "Quando o Windows perguntar se deixa fazer alterações, clique em <b>Sim</b>.", "Vai abrir a janela do cabo de áudio (VB-CABLE). Clique em <b>Install Driver</b> e depois em <b>OK</b>. Pode demorar alguns segundos.", "Espere a tela dizer <b>Pronto</b>. O próximo passo é reiniciar o computador."],
        note: "O Windows pode mostrar uma tela azul dizendo “O Windows protegeu o computador”, ou um aviso de segurança. É normal para programas novos. Clique em <b>Mais informações</b> e depois em <b>Executar assim mesmo</b> (ou só em <b>Executar</b>). Este instalador é texto aberto e só faz o que o guia diz: guarda a extensão e baixa o cabo de áudio gratuito do site oficial da VB-Audio.",
        see: "O Windows vai perguntar isto. Clique em Sim.", mock: "uac" },
      { h: "Reinicie o computador", cap: "Reiniciando o computador",
        do: ["<b>Antes de reiniciar, guarde esta página:</b> aperte <span class=\"k\">Ctrl</span> + <span class=\"k\">D</span> para salvar nos favoritos do Chrome, ou mande o link para você mesmo no WhatsApp.", "Clique no botão <b>Iniciar</b> do Windows, depois em <b>Energia</b> e em <b>Reiniciar</b>.", "Quando o computador voltar, abra o Chrome e entre de novo por este link. O guia lembra onde você parou: é só clicar em <b>Continuar</b>."],
        note: "Por que reiniciar? O Windows só reconhece o cabo de áudio novo depois de reiniciar. Sem isso, o passo do áudio não funciona. Ao reiniciar, tudo fecha, inclusive esta página.",
        see: "O caminho para reiniciar", mock: "restart", link: true },
      { h: "Adicione a extensão ao Chrome", cap: "Carregando a extensão no Chrome",
        do: ["Abra o Google Chrome. Na faixa branca do topo (a barra de endereço), apague o que estiver escrito, digite <code>chrome://extensions</code> e aperte <b>Enter</b>.", "Ligue a chavinha <b>Modo do desenvolvedor</b> (canto de cima, à direita).", "Clique em <b>Carregar sem compactação</b>. Na janela que abrir, clique em <b>Este Computador</b> › <b>Disco Local (C:)</b> › <b>LegendaDeAula</b> › <b>extensao</b> e depois em <b>Selecionar pasta</b>.", "Não apague essa pasta depois: é nela que a extensão fica guardada."],
        see: "Procure esta chavinha e este botão", mock: "ext" },
      { h: "Configure o áudio da reunião", cap: "Escolhendo o alto-falante na reunião",
        do: ["Entre na aula pelo Zoom ou Meet, como sempre.", "Abra as configurações de áudio: no <b>Zoom</b>, clique na setinha ao lado do microfone e em <b>Configurações de áudio</b>; no <b>Meet</b>, clique nos três pontinhos › <b>Configurações</b> › <b>Áudio</b>.", "No <b>alto-falante</b>, escolha <b>CABLE Input</b>. No <b>microfone</b>, deixe o seu microfone normal."],
        note: "O som da aula passa pelo cabo para a legenda poder ouvir. No próximo passo você faz o som voltar para o seu fone.",
        see: "Na reunião, deixe assim", mock: "audio" },
      { h: "Ouça a aula no seu fone", cap: "Fazendo o som voltar para o seu fone",
        do: ["Clique com o botão direito no ícone de alto-falante, perto do relógio, e escolha <b>Sons</b>.", "Aba <b>Gravação</b> › clique em <b>CABLE Output</b> › <b>Propriedades</b>.", "Aba <b>Ouvir</b>: marque <b>Escutar este dispositivo</b>, escolha o seu fone ou caixa de som e clique em <b>OK</b>."],
        note: "Sem este passo você não escuta a aula, porque o som passa pelo cabo. Você faz isso só uma vez.",
        see: "O caminho no Windows", mock: "listen" },
      { h: "Abra a legenda e inicie", cap: "Iniciando a legenda",
        do: ["No Chrome, clique no ícone de quebra-cabeça e depois em <b>Legenda de Aula</b>. A barra lateral abre.", "Escolha quem fala o quê (veja abaixo).", "Clique em <b>▶ Iniciar</b> e, se o Chrome pedir o microfone, clique em <b>Permitir</b>.", "Em <code>chrome://settings/content/microphone</code>, deixe o microfone do Chrome em <b>CABLE Output</b>."],
        dir: true, see: "Assim aparece a legenda", mock: "caption" },
      { h: "Pronto", done: true }
    ],
    dirLabel: "Escolha o idioma da aula:", d1: "Espanhol → Português", d2: "Português → Espanhol", dnote: "Na barra lateral, o primeiro menu troca o sentido. Quem fala espanhol e assiste aula em português usa “Português → Espanhol”.",
    doneT: "Tudo certo!", doneP: "A legenda aparece na barra lateral, e no fim da aula você clica em <b>Salvar</b> para guardar o texto e estudar depois.",
    help: "Se algo não funcionar: abra o vídeo do passo de novo e confira se o Chrome está usando o microfone “CABLE Output”.",
    files: ["INSTALAR.bat", "DESINSTALAR.bat", "LEIA-ME.txt", "extensao (pasta)", "scripts (pasta)"],
    uac: "Deseja permitir que este aplicativo faça alterações no dispositivo?", yes: "Sim", no: "Não",
    ext: ["Modo do desenvolvedor", "Carregar sem compactação"], aud: ["Alto-falante", "Microfone", "Seu microfone normal"],
    cap1: "Voz 1 · professor", cap1t: "Hoje vamos combinar o prazo de entrega do trabalho final."
  },
  es: {
    proto: "Proyecto gratuito y sin fines de lucro. Funciona solo en Windows, con Google Chrome.",
    title: "Subtítulos de Clase", sub: "Subtítulos y traducción en vivo de las clases de la maestría, gratis, en tu computadora con Windows.",
    of: (a, b) => `Paso ${a} de ${b}`, time: "unos 15 minutos, con el reinicio", back: "Atrás", next: "Siguiente paso", finish: "Terminar", restart: "Ver de nuevo",
    video: "Animación de este paso. Haz clic en la imagen para verla de nuevo.", checked: "Ya hice este paso",
    steps: [
      { h: "Descarga y abre la carpeta", cap: "Descargando y extrayendo la carpeta",
        do: ["Haz clic en el botón azul <b>Descargar el instalador (.zip)</b> aquí abajo y espera a que termine.", "Abre el <b>Explorador de archivos</b> (el ícono de carpeta amarilla en la barra de abajo de la pantalla) y haz clic en <b>Descargas</b>, en el menú de la izquierda.", "Haz clic con el <b>botón derecho</b> del mouse en <code>Legenda-de-Aula.zip</code> (en la notebook, toca con dos dedos el touchpad) y elige <b>Extraer todo…</b>.", "Haz clic en <b>Extraer</b> y abre la carpeta que apareció. <b>No abras los archivos desde dentro del zip</b>: extrae primero."],
        note: "Si Chrome avisa que este tipo de archivo no se descarga con frecuencia, haz clic en <b>Conservar</b>. Es el instalador gratuito de esta guía.",
        see: "Vas a ver una carpeta con estos elementos", mock: "files", dl: true },
      { h: "Instala el cable de audio", cap: "Instalando el cable de audio",
        do: ["Dentro de la carpeta, haz doble clic en <code>INSTALAR.bat</code>.", "Cuando Windows pregunte si permites cambios, haz clic en <b>Sí</b>.", "Se abre la ventana del cable de audio (VB-CABLE). Haz clic en <b>Install Driver</b> y luego en <b>OK</b>. Puede tardar unos segundos.", "Espera a que diga <b>Listo</b>. El siguiente paso es reiniciar la computadora."],
        note: "Windows puede mostrar una pantalla azul que dice “Windows protegió su PC”, o un aviso de seguridad. Es normal en programas nuevos. Haz clic en <b>Más información</b> y luego en <b>Ejecutar de todas formas</b> (o solo en <b>Ejecutar</b>). Este instalador es texto abierto y solo hace lo que dice la guía: guarda la extensión y descarga el cable de audio gratuito del sitio oficial de VB-Audio.",
        see: "Windows va a preguntar esto. Haz clic en Sí.", mock: "uac" },

function render() {

  $('bpt').setAttribute('aria-pressed', lang === 'pt'); $('bes').setAttribute('aria-pressed', lang === 'es');
  $('prog').innerHTML = S.map((_, i) => `<i class="${i < step ? 'done' : i === step ? 'now' : ''}"></i>`).join('');
  $('stepOf').textContent = t.of(step + 1, n); $('time').textContent = t.time;
  saveState(); showResume(t);
  $('back').textContent = t.back; $('back').disabled = step === 0;
  $('next').textContent = s.done ? t.restart : (step === n - 2 ? t.finish : t.next);

    <div class="stage" id="stage" role="img" aria-label="${s.cap}"></div><div class="vcap">${t.video}</div>

    ${s.note ? `<div class="note">${s.note}</div>` : ''}
    ${s.dl ? dlBox() : ''}
    ${s.link ? linkBox() : ''}
    <div class="see"><small>${s.see}</small>${mock(s.mock, t)}</div>
    ${dir}
    <label class="chk"><input type="checkbox" id="ck" ${checked[step] ? 'checked' : ''}> ${t.checked}</label>`;
  $('ck').onchange = e => { checked[step] = e.target.checked; };
  const cp = $('cp');
  if (cp) cp.onclick = async () => {
    const pt = lang === 'pt';
    try { await navigator.clipboard.writeText(GUIDE_URL); cp.textContent = pt ? '✓ Link copiado' : '✓ Enlace copiado'; }
    catch (e) { $('lk').focus(); $('lk').select(); cp.textContent = pt ? 'Agora aperte Ctrl + C' : 'Ahora presiona Ctrl + C'; }
  };
  play(step);
}

  st.innerHTML = sc.html + CUR;
  st.onclick = () => play(i);
  const q = id => st.querySelector('#' + id), cur = q('cur'), rip = q('rip'), capb = q('capb');
  let cx = 50, cy = 70;
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const act = a => {
    const k = a[1], x = a[2], y = a[3];
    if (k === 'm') { cx = x; cy = y; cur.style.left = x + '%'; cur.style.top = y + '%'; }
    else if (k === 'c') { rip.style.left = cx + '%'; rip.style.top = cy + '%'; rip.classList.remove('go'); void rip.offsetWidth; rip.classList.add('go'); }
    else if (k === 's') q(x).hidden = false;
    else if (k === 'h') q(x).hidden = true;
    else if (k === 'k') q(x).classList.toggle('on');
    else if (k === 't') q(x).textContent = y;
    else if (k === 'ty') {
      const el = q(x), full = y; let n = 0;
      if (still) { el.textContent = full; return; }
      const v = setInterval(() => { el.textContent = full.slice(0, ++n); if (n >= full.length) clearInterval(v); }, 60); ivs.push(v);
    }
    else if (k === 'cap') { capb.hidden = false; capb.textContent = sc.caps[x][lang === 'pt' ? 0 : 1]; }
  };
  if (still) { sc.tl.forEach(act); return; }
  sc.tl.forEach(a => tms.push(setTimeout(() => act(a), a[0])));
  tms.push(setTimeout(() => {
    const r = document.createElement('div'); r.className = 'rp'; r.textContent = lang === 'pt' ? '↻ Ver de novo' : '↻ Ver de nuevo'; st.appendChild(r);
  }, sc.len));
}
$('bpt').onclick = () => setLang('pt'); $('bes').onclick = () => setLang('es');
function setLang(l) { lang = l; try { localStorage.setItem('guia-lang', l); } catch (e) {} render(); }
$('back').onclick = () => { if (step > 0) { step--; render(); window.scrollTo(0, 0); } };
$('next').onclick = () => { const n = T[lang].steps.length; step = step >= n - 1 ? 0 : step + 1; render(); window.scrollTo(0, 0); };
// Lembra onde a pessoa parou (o computador reinicia no meio do caminho).
let resume = 0;
try { const sv = JSON.parse(localStorage.getItem('guia-state') || 'null'); if (sv && sv.step > 0 && sv.step < T.pt.steps.length - 1) { resume = sv.step; Object.assign(checked, sv.checked || {}); } } catch (e) {}
function saveState() { if (resume > 0) return; try { localStorage.setItem('guia-state', JSON.stringify({ step, checked })); } catch (e) {} }
function showResume(t) {
  const r = $('resume');
  if (resume <= 0) { r.innerHTML = ''; return; }
  r.innerHTML = `<div class="resume"><p>${lang === 'pt' ? `Você parou no passo ${resume + 1}. Quer continuar de onde parou?` : `Te quedaste en el paso ${resume + 1}. ¿Quieres continuar desde ahí?`}</p><div class="acts"><button class="main" id="rc">${lang === 'pt' ? 'Continuar' : 'Continuar'}</button><button id="rz">${lang === 'pt' ? 'Começar do zero' : 'Empezar de cero'}</button></div></div>`;
  $('rc').onclick = () => { step = resume; resume = 0; render(); };
  $('rz').onclick = () => { step = 0; resume = 0; Object.keys(checked).forEach(k => delete checked[k]); render(); };
}
render();
